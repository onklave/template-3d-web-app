# Onklave deploy manifest.
#
# The platform reads THIS file to build and deploy the repo: it clones, builds
# the image in-cluster, runs the tests, then renders the Deployment, Service
# and Ingress from the values below. GitHub Actions is not used — nothing in
# .github/ is read, and a workflow file cannot declare a service.
#
# To add a second deployable, add another entry under `services` with its own
# build context and expose.path (e.g. /api). Exactly one service may use `/`.
version: 1
services:
  - name: app
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time config. Vite bakes VITE_* when `npm run build` runs inside
      # the build pod, so these cannot be set on the running container — the
      # platform passes them to the image build as Docker --build-args.
      #
      # Values here are PUBLIC: build args are readable from image history and a
      # VITE_ value is compiled into the shipped bundle. A secret-looking key is
      # rejected by contract validation. Uncomment to load models from the
      # Onklave asset library (CC0) instead of this repo's `public/`:
      #
      # args:
      #   VITE_CONTENT_BASE_URL: https://assets.onklave.app
      #   VITE_MODEL_PATH: kenney/3.6.0/car-kit/ambulance.glb
    runtime:
      port: 3000
      healthPath: /health
    expose:
      enabled: true
      path: /
